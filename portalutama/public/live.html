<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layar Live Otomatis - TikTok Live Studio</title>
    <script src="/vercel-client.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #09090b;
        }
        .game-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.35s ease;
        }
        .hidden-frame {
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }
        .active-frame {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }
    </style>
</head>
<body>

    <iframe id="frame-pou" class="game-frame active-frame" src="/pou/index.html"></iframe>
    <iframe id="frame-capit" class="game-frame hidden-frame" src="about:blank"></iframe>

    <script>
        const portalSocket = createVercelSocket('/portal');	
        const framePou = document.getElementById('frame-pou');
        const frameCapit = document.getElementById('frame-capit');
        let currentActive = null;

        function switchLiveScreen(game) {
            if (currentActive === game) return;
            currentActive = game;

            if (game === 'pou') {
                // Muat Pou jika belum dimuat, dan kosongkan Capit agar audio BGM Capit berhenti total
                if (!framePou.src.includes('/pou/index.html')) {
                    framePou.src = '/pou/index.html';
                }
                frameCapit.src = 'about:blank';

                framePou.classList.replace('hidden-frame', 'active-frame');
                frameCapit.classList.replace('active-frame', 'hidden-frame');
            } else if (game === 'capit') {
                // Muat Capit secara langsung
                frameCapit.src = '/capit/index.html';

                frameCapit.classList.replace('hidden-frame', 'active-frame');
                framePou.classList.replace('active-frame', 'hidden-frame');
            }
        }

        portalSocket.on('portal_state', ({ activeGame }) => {
            switchLiveScreen(activeGame);
        });
    </script>
</body>
</html>
